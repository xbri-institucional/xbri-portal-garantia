  <style>
    /* GAR-REV-01.01_Login: fundo, input-text (Dark) e button Primary */
    .gate {
      --gu: calc(100vw / 1640);
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding-bottom: calc(190 * var(--gu));
      background:
        linear-gradient(125.7357deg, rgba(29, 45, 72, 0.4) 38.677%, rgba(29, 45, 72, 0) 65.117%),
        linear-gradient(118.052deg, rgba(0, 0, 0, 0.7) 52.788%, rgba(0, 0, 0, 0) 88.776%),
        #212121;
      color: #fff;
      font-family: "Montserrat", sans-serif;
    }
    .gate__form { width: calc(410 * var(--gu)); display: flex; flex-direction: column; align-items: flex-start; }
    .gate__logo { width: calc(131.52 * var(--gu)); height: calc(24 * var(--gu)); margin-bottom: calc(40 * var(--gu)); }
    .gate__title { margin: 0 0 calc(30 * var(--gu)); font-family: "termina", sans-serif; font-weight: 400; font-size: calc(16 * var(--gu)); line-height: normal; letter-spacing: calc(4 * var(--gu)); text-transform: uppercase; color: #fff; }
    .gate__fields { width: 100%; display: flex; flex-direction: column; gap: calc(20 * var(--gu)); }
    .gate__input { position: relative; display: block; width: 100%; height: calc(55 * var(--gu)); background: #2d384b; border: 1px solid transparent; transition: border-color var(--dissolve, .7s cubic-bezier(.33,0,.2,1)), background-color var(--dissolve, .7s cubic-bezier(.33,0,.2,1)); cursor: text; }
    .gate__input input { position: absolute; left: calc(16 * var(--gu)); right: calc(16 * var(--gu)); top: calc(19 * var(--gu)); height: calc(28 * var(--gu)); padding: 0; border: 0; background: transparent; outline: none; color: #fff; font-family: "Montserrat", sans-serif; font-size: calc(14 * var(--gu)); caret-color: #fff; }
    .gate__input span { position: absolute; left: calc(16 * var(--gu)); top: 50%; transform: translateY(-50%); font-size: calc(12 * var(--gu)); line-height: normal; text-transform: uppercase; color: #fff; pointer-events: none; transition: top .5s cubic-bezier(.19,1,.22,1), font-size .5s cubic-bezier(.19,1,.22,1), transform .5s cubic-bezier(.19,1,.22,1); }
    .gate__input:focus-within { border-color: #3a5178; }
    .gate__input:focus-within span,
    .gate__input input:not(:placeholder-shown) + span { top: 13.48%; transform: none; font-size: calc(11 * var(--gu)); }
    .gate__input input:not(:placeholder-shown) { }
    .gate__input:has(input:not(:placeholder-shown)) { border-color: #3a5178; }
    .gate.is-error .gate__input { background: #372122; border-color: #c94701; }
    .gate__error { margin: calc(-8 * var(--gu)) 0 0; min-height: calc(14 * var(--gu)); font-size: calc(12 * var(--gu)); color: #c94701; }
    .gate__error:empty { display: none; }
    .gate__actions { display: flex; justify-content: flex-end; width: 100%; }
    .gate__btn { position: relative; overflow: hidden; height: calc(40 * var(--gu)); padding: 0 calc(20 * var(--gu)); border: 0; background: #b90004; color: #fff; font-family: "termina", sans-serif; font-weight: 600; font-size: calc(11 * var(--gu)); text-transform: uppercase; cursor: pointer; transition: background-color var(--dissolve, .7s cubic-bezier(.33,0,.2,1)); }
    .gate__btn:hover, .gate__btn:focus-visible { background: #e3151a; outline: none; }
    .is-busy .gate__btn { opacity: .6; pointer-events: none; }
  </style>

        document.getElementById('gate').classList.add('is-error');
        form.classList.remove('is-busy');
      }
    });
  })();
  </script>
</body>
